<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UWB Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F3F6F5; --surface: #FFFFFF; --ink: #15201C; --muted: #5A6962; --line: #D2DBD7; --accent: #1B6A87;
    --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F1513; --surface: #151D1A; --ink: #E1E8E4; --muted: #93A39B; --line: #2A3632; --accent: #6BBFDD;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1513; --surface: #151D1A; --ink: #E1E8E4; --muted: #93A39B; --line: #2A3632; --accent: #6BBFDD;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-sans); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 28px; }
  .eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 6px; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  .list { display: grid; gap: 12px; }
  a.item { display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; text-decoration: none; }
  a.item:hover, a.item:focus-visible { border-color: var(--accent); outline: none; }
  a.item b { font-size: 17px; font-weight: 600; }
  a.item span { color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">UWB · IMU · Wi-Fi/BLE RSS 퓨전 실내 측위</div>
    <h1>UWB Lab</h1>
    <p>UWB 품질이 나빠지는 조건에서 IMU·Wi-Fi RSS·BLE RSS의 기여도를 비교하는 실험 자료 모음.</p>
  </header>
  <nav class="list" aria-label="페이지 목록">
    <a class="item" href="equipment-sim/">
      <b>장비 시뮬레이터 →</b>
      <span>필요한 장비, 테스트 방 배치, 테스트별 진행 방식, 보드·점퍼선 배선 조립을 3D로 확인한다.</span>
    </a>
  </nav>
  <footer>UWB 퓨전 측위 연구 실험 자료</footer>
</div>
</body>
</html>
